# Media CDN origin: serves the media service's output read-only. Mounted into
# an nginx container (compose.yaml, infra/dev-server/compose.yaml). In front of
# it on the dev server is the host nginx; later, a real CDN (ADR-0006).
#
# Layout: /<did>/<blob cid>/playlist.m3u8, /<rendition>/{init_N.mp4,seg_NNN.m4s},
# poster.jpg. Paths are content-addressed, so segments never change.
server {
    listen 8080;
    root /media;
    autoindex off;

    # Scratch space (.work) and anything else hidden.
    location ~ /\. {
        return 404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Playlists are small and could be regenerated if the ladder changes.
    location ~ \.m3u8$ {
        types { application/vnd.apple.mpegurl m3u8; }
        add_header Cache-Control "public, max-age=60";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~ \.(m4s|mp4|jpg)$ {
        types {
            video/iso.segment m4s;
            video/mp4 mp4;
            image/jpeg jpg;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        return 404;
    }
}
