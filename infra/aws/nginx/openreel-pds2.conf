# nginx site for the second PDS (ADR-0008), installed at
# /etc/nginx/sites-available/openreel-pds2 by ../scripts/deploy.sh once its
# certificate exists. deploy.sh replaces PDS2_HOSTNAME below with the real
# hostname. Port 80, including the ACME challenge, is served by the default
# server in openreel.conf.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name PDS2_HOSTNAME;

    ssl_certificate /etc/letsencrypt/live/PDS2_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PDS2_HOSTNAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # PDS blob uploads.
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The whole host is the PDS: XRPC, OAuth, /.well-known, and the
    # subscribeRepos WebSocket the relay reads.
    location / {
        proxy_pass http://127.0.0.1:4108;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openreel_connection_upgrade;
        proxy_read_timeout 1h;
    }
}
