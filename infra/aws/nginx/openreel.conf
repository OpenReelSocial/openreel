# nginx site for the AWS host (ADR-0007), installed at
# /etc/nginx/sites-available/openreel by ../scripts/deploy.sh on every deploy.
# Unlike the Hetzner site, certbot does not edit this file: it only obtains
# and renews the certificate through the webroot below, so the whole
# configuration, TLS included, lives here.
#
# The PDS owns the root (its DID documents point at https://<host>/), and the
# other public services sit under path prefixes. Ports match
# ../../dev-server/compose.yaml. Media is served by CloudFront once the media
# worker writes to S3; until then /media/ proxies the media-cdn container.

map $http_upgrade $openreel_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dev.openreel.social;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 'listen ... http2' rather than 'http2 on': Ubuntu 24.04 ships nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.openreel.social;

    ssl_certificate /etc/letsencrypt/live/dev.openreel.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.openreel.social/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:openreel_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # PDS blob uploads.
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Private PLC directory, read-only from outside.
    location /plc/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:4101/;
    }

    location /appview/ {
        proxy_pass http://127.0.0.1:4102/;
    }

    location /feedgen/ {
        proxy_pass http://127.0.0.1:4103/;
    }

    # HLS from the media-cdn container, while MEDIA_STORE=fs.
    location /media/ {
        proxy_pass http://127.0.0.1:4106/;
    }

    # The admin service's debug portal: live SQL and pipeline state, open to
    # anyone (dev data only). Nothing else of the admin service is exposed. The query stream is server-sent events,
    # so responses are not buffered and may stay open.
    location = /debug {
        proxy_pass http://127.0.0.1:4104;
    }
    location /debug/ {
        proxy_pass http://127.0.0.1:4104;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # OAuth client metadata for iOS builds signing in here (ADR-0004). The PDS
    # fetches it by its URL, the client_id. The redirect scheme is this host
    # reversed, as the atproto OAuth profile requires for native clients.
    location = /oauth/ios-client-metadata.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        return 200 '{"client_id":"https://dev.openreel.social/oauth/ios-client-metadata.json","client_name":"OpenReel for iOS (AWS dev)","client_uri":"https://dev.openreel.social","application_type":"native","redirect_uris":["social.openreel.dev:/oauth/callback"],"scope":"atproto transition:generic","grant_types":["authorization_code","refresh_token"],"response_types":["code"],"token_endpoint_auth_method":"none","dpop_bound_access_tokens":true}';
    }

    # PDS: XRPC, OAuth, /.well-known, and the subscribeRepos WebSocket.
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openreel_connection_upgrade;
        proxy_read_timeout 1h;
    }
}
