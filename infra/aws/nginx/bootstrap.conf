# Temporary site for the AWS host's first deploy (ADR-0007), installed by
# ../scripts/deploy.sh only until a certificate exists: it answers Let's
# Encrypt's HTTP-01 challenge and nothing else. openreel.conf replaces it.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dev.openreel.social;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
