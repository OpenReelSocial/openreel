# Personal Data Server, layered onto the root compose.yaml by 'make up'.
#
# Lives under infra/ rather than services/ because OpenReel does not author this
# component; the directory holds deployment configuration and operational tooling.
#
# See docs/adr/0002-foundational-technology-stack.md.
#
# Kept out of the root compose.yaml because Compose interpolates every service in
# a file regardless of profile, so the required-variable guards below would break
# a plain 'make up' that only wants Postgres and Redis.

services:
  # A private PLC directory keeps disposable development identities off the
  # public plc.directory registry. The upstream image is pinned to its build
  # commit because no maintained semantic-version tag is published.
  plc-db:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plc
      POSTGRES_PASSWORD: plc_dev
      POSTGRES_DB: plc
    volumes:
      - plc-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plc -d plc']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  plc:
    image: ghcr.io/bluesky-social/did-method-plc:plc-f2ab7516bac5bc0f3f86842fa94e996bd1b3815b
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PORT: 8080
      PLC_VERSION: dev-f2ab7516
      LOG_ENABLED: 'true'
      ENABLE_MIGRATIONS: 'true'
      DB_CREDS_JSON: '{"username":"plc","password":"plc_dev","host":"plc-db","port":5432,"database":"plc"}'
      DB_MIGRATE_CREDS_JSON: '{"username":"plc","password":"plc_dev","host":"plc-db","port":5432,"database":"plc"}'
    # Loopback only: the iOS Simulator resolves local DIDs to their documents
    # here. The PDS keeps using the in-network plc:8080 address.
    ports:
      - '127.0.0.1:${PLC_PORT:-2582}:8080'
    depends_on:
      plc-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8080/_health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Upstream Bluesky PDS, operated rather than authored by OpenReel. It keeps its
  # own SQLite repositories and blob store under PDS_DATA_DIRECTORY and does not
  # use the postgres service from the root compose.yaml.
  pds:
    image: ghcr.io/bluesky-social/pds:0.4.219
    restart: unless-stopped
    environment:
      PDS_HOSTNAME: ${PDS_HOSTNAME:-localhost}
      # The pinned PDS rejects .localhost as an account-handle TLD. This
      # reserved domain is accepted syntactically and never needs public DNS.
      PDS_SERVICE_HANDLE_DOMAINS: .pds.example.com
      PDS_PORT: 3000
      # Local only. @atproto/pds requires an https OAuth resource URL, which a
      # plain-http localhost hostname cannot produce; dev mode relaxes that.
      # A deployed PDS uses a real openreel.social subdomain behind TLS and must
      # leave this false.
      PDS_DEV_MODE: ${PDS_DEV_MODE:-false}
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      # Always private in this local-only descriptor. Do not let an old .env
      # accidentally publish disposable localhost identities to plc.directory.
      PDS_DID_PLC_URL: http://plc:8080
      # Disposable local accounts are created by the event-flow demonstration.
      PDS_INVITE_REQUIRED: 'false'
      # The image logs nothing unless asked; upstream's installer sets the same.
      # Without it 'make pds-logs' is empty and a bad start is invisible.
      LOG_ENABLED: 'true'
      PDS_JWT_SECRET: ${PDS_JWT_SECRET:?set PDS_JWT_SECRET in .env}
      PDS_ADMIN_PASSWORD: ${PDS_ADMIN_PASSWORD:?set PDS_ADMIN_PASSWORD in .env}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX:?set PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX in .env}
    ports:
      - '${PDS_EXPOSED_PORT:-3000}:3000'
    volumes:
      - pds-data:/pds
    depends_on:
      plc:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/xrpc/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Jetstream is Bluesky's lightweight JSON view of subscribeRepos. It keeps
  # protocol decoding out of OpenReel services while retaining the standard PDS
  # event source underneath. The sha tag makes the local event boundary stable.
  jetstream:
    image: ghcr.io/bluesky-social/jetstream:sha-d5a3b62
    platform: linux/amd64
    restart: unless-stopped
    environment:
      JETSTREAM_DATA_DIR: /data
      JETSTREAM_LISTEN_ADDR: :6008
      JETSTREAM_METRICS_LISTEN_ADDR: :6009
      # Jetstream exits when no event arrives within this TTL. That suits the
      # Bluesky firehose, but our PDS is idle for long stretches, so 300s
      # restarted it every 10 minutes. A dropped PDS connection still exits
      # (and restarts) on its own; this only stops idle restarts.
      JETSTREAM_LIVENESS_TTL: 8760h
      JETSTREAM_WS_URL: ws://pds:3000/xrpc/com.atproto.sync.subscribeRepos
    ports:
      - '127.0.0.1:${JETSTREAM_PORT:-6008}:6008'
    volumes:
      - jetstream-data:/data
    depends_on:
      pds:
        condition: service_healthy

  event-consumer:
    build:
      # Compose resolves overlay paths from the first file (root compose.yaml).
      context: .
      dockerfile: services/event-consumer/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-development}
      JETSTREAM_URL: ws://jetstream:6008/subscribe?wantedCollections=app.bsky.actor.profile&wantedCollections=social.openreel.*
      EVENT_BUFFER_SIZE: ${EVENT_BUFFER_SIZE:-100}
    ports:
      - '127.0.0.1:${EVENT_CONSUMER_PORT:-3004}:3004'
    depends_on:
      jetstream:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3004/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin:
    depends_on:
      event-consumer:
        condition: service_healthy

volumes:
  pds-data:
  plc-data:
  jetstream-data:
