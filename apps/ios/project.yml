name: OpenReel
options:
  bundleIdPrefix: social.openreel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  OpenReel:
    type: application
    platform: iOS
    sources:
      - path: Sources/OpenReel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: social.openreel.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenReel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
