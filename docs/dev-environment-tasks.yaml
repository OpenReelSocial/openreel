project: OpenReel
artifact: Development and Agent Infrastructure Backlog
version: 1
status_values:
- todo
- in_progress
- blocked
- done
- deferred
priority_values:
- critical
- high
- medium
- low
usage:
  principle: Treat this as an agile backlog, not a fixed specification. Revisit later tasks as architecture becomes
    concrete.
  agent_prompt_example: Implement DEV-016 from docs/dev-environment-tasks.yaml. Inspect its dependencies and acceptance
    criteria first. Inspect the existing repository before changing anything, make no unrelated changes, run available
    validation, and report blockers rather than inventing missing requirements.
  workflow:
  - Select one task or a tightly coupled batch.
  - Confirm dependencies are satisfied or explicitly defer unresolved dependencies.
  - Use one task per branch/worktree where practical.
  - Implement only the requested scope.
  - Run the task's relevant validation and the repository's canonical make check once available.
  - Open or prepare a reviewable PR and record unresolved blockers in durable GitHub artifacts.
tasks:
- id: DEV-001
  title: Create root AGENTS.md
  phase: repository-foundation
  priority: critical
  status: todo
  dependencies: []
  description: Create canonical repository-level instructions for humans and coding agents working on OpenReel.
  acceptance_criteria:
  - Explains OpenReel at a high level and points to authoritative project documentation and ADRs.
  - Defines the source-of-truth hierarchy and tells agents to surface conflicts rather than guess.
  - Defines Git/PR, security, scope-control, and verification expectations.
  - Clearly distinguishes commands and infrastructure that exist from those that are only planned.
  agent_notes:
  - Inspect the repository before editing.
  - Do not duplicate vendor-specific instructions here unless they apply to all agents.
